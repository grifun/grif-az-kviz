<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ-kvíz</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 93,27 93,73 50,96 7,73 7,27' fill='%23ff8a1f'/></svg>">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  header svg { width: 120px; height: 110px; flex: none; }
  header .txt { flex: 1 1 300px; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); margin: 0; letter-spacing: -.02em; }
  h1 span { color: var(--p0); }
  .lead { color: var(--muted); margin: .3em 0 0; }
  .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 1.15rem; }
  .card h3 { margin: 18px 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  .row label span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .name-p0 input { border-color: var(--p0); } .name-p1 input { border-color: var(--p1); }
  details summary { cursor: pointer; color: var(--muted); margin: 14px 0 8px; }
  .create { width: 100%; font-size: 1.15rem; padding: .9em; margin-top: 14px; }
  .rules ol { padding-left: 1.2em; margin: 0; line-height: 1.55; }
  .rules li { margin-bottom: .45em; }
  .hint { font-size: .8rem; color: var(--muted); }
  .err { color: var(--bad); margin-top: 8px; min-height: 1.2em; }
  .setbtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <svg id="logo"></svg>
    <div class="txt">
      <h1>AZ-<span>kvíz</span></h1>
      <p class="lead" data-i18n="home_lead"></p>
    </div>
    <div class="langswitch" id="langswitch"><button type="button" data-lang="cs">CS</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <div class="grid">
    <form class="card" id="form">
      <h2 data-i18n="new_game"></h2>
      <div class="row">
        <label class="name-p0"><span><i class="dot p0"></i> <span data-i18n="player1" style="display:inline"></span></span><input type="text" name="p0" maxlength="40"></label>
        <label class="name-p1"><span><i class="dot p1"></i> <span data-i18n="player2" style="display:inline"></span></span><input type="text" name="p1" maxlength="40"></label>
      </div>
      <div class="row">
        <label><span data-i18n="labels"></span>
          <select name="label_mode">
            <option value="numbers" data-i18n="labels_numbers"></option>
            <option value="letters" data-i18n="labels_letters"></option>
          </select>
        </label>
        <label><span data-i18n="answer_time"></span><input type="number" name="answer_seconds" value="10" min="0" max="120"></label>
      </div>
      <label><input type="checkbox" name="show_question" checked> <span data-i18n="show_question"></span></label>

      <h3 data-i18n="question_sets"></h3>
      <div id="sets"></div>
      <div class="setbtns">
        <button class="btn small" type="button" id="setsLang" data-i18n="select_lang_sets"></button>
        <button class="btn small" type="button" id="setsNone" data-i18n="select_none"></button>
        <a class="btn small" href="/sets" target="_blank" data-i18n="edit_sets"></a>
      </div>
      <p class="hint" id="setTotal"></p>
      <p class="warn" id="setWarn" hidden></p>

      <details>
        <summary data-i18n="custom_questions"></summary>
        <textarea name="questions" placeholder="Hlavní město Francie? | Paříž&#10;Je Slunce hvězda? | ANO&#10;What is the capital of Italy? | Rome"></textarea>
        <p class="hint" data-i18n="custom_help"></p>
      </details>
      <button class="btn accent create" type="submit" data-i18n="create"></button>
      <p class="hint" data-i18n="create_help"></p>
      <div class="err" id="err"></div>
    </form>

    <section class="card rules">
      <h2 data-i18n="rules"></h2>
      <ol>
        <li data-i18n="rule1"></li><li data-i18n="rule2"></li><li data-i18n="rule3"></li>
        <li data-i18n="rule4"></li><li data-i18n="rule5"></li><li data-i18n="rule6"></li>
      </ol>
    </section>
  </div>
</main>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form");
  let sets = [], selected = new Set(), touchedSets = false;

  // decorative mini board in the header
  (() => {
    const b = AZ.createBoard($("logo"));
    const cells = Array(28).fill(-1);
    [0, 1, 3, 6, 10, 15, 21].forEach(i => cells[i] = 0);
    [2, 5, 9, 14, 20, 27, 26].forEach(i => cells[i] = 1);
    cells[12] = 2;
    b.update({ cells, labels: Array(28).fill(""), win_cells: [], active: null });
  })();

  // ---- language ----
  function storedLang() {   // Czech unless the user picked English on this device
    try { const l = localStorage.getItem("azkviz-ui-lang"); if (l) return l; } catch (_) {}
    return "cs";
  }
  function setLang(l) {
    const prev = I18N.lang;
    I18N.set(l);
    I18N.apply();
    try { localStorage.setItem("azkviz-ui-lang", l); } catch (_) {}
    document.querySelectorAll("#langswitch button").forEach((b) => b.classList.toggle("on", b.dataset.lang === l));
    // swap untouched default names
    ["p0", "p1"].forEach((n) => {
      const inp = form.elements[n];
      if (!inp.value || inp.value === defaultName(prev, n)) inp.value = defaultName(l, n);
    });
    if (!touchedSets) selectLangSets();
    renderSets();
  }
  const DEFAULT_NAMES = { cs: { p0: "Oranžový", p1: "Modrý" }, en: { p0: "Orange", p1: "Blue" } };
  const defaultName = (l, n) => DEFAULT_NAMES[l][n];
  document.querySelectorAll("#langswitch button").forEach((b) => (b.onclick = () => setLang(b.dataset.lang)));

  // ---- question sets ----
  function selectLangSets() { selected = new Set(sets.filter((s) => s.lang === I18N.lang).map((s) => s.id)); }
  function renderSets() {
    AZ.renderSets($("sets"), sets, {
      selected,
      onToggle: (id, on) => { touchedSets = true; on ? selected.add(id) : selected.delete(id); renderTotals(); },
    });
    renderTotals();
  }
  function renderTotals() {
    const chosen = sets.filter((s) => selected.has(s.id));
    const open = chosen.reduce((n, s) => n + s.open, 0), yesno = chosen.reduce((n, s) => n + s.yesno, 0);
    $("setTotal").textContent = I18N.t("pool_total", { open, yesno });
    const warn = [!open && I18N.t("warn_no_open"), !yesno && I18N.t("warn_no_yesno")].filter(Boolean).join(" ");
    $("setWarn").hidden = !warn;
    $("setWarn").textContent = warn;
  }
  $("setsLang").onclick = () => { touchedSets = true; selectLangSets(); renderSets(); };
  $("setsNone").onclick = () => { touchedSets = true; selected = new Set(); renderSets(); };

  // (Re)load the sets; called again when returning from the set editor in another tab.
  function loadSets() {
    return fetch("/api/sets").then((r) => r.json()).then((data) => {
      sets = data;
      if (touchedSets) selected = new Set([...selected].filter((id) => sets.some((s) => s.id === id)));
      else selectLangSets();
      renderSets();
    });
  }
  loadSets();
  addEventListener("focus", () => loadSets().catch(() => {}));
  setLang(storedLang());

  // ---- create ----
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const f = new FormData(form);
    const body = {
      names: [f.get("p0"), f.get("p1")],
      settings: {
        lang: I18N.lang,
        label_mode: f.get("label_mode"),
        answer_seconds: Number(f.get("answer_seconds") || 0),
        show_question: f.get("show_question") === "on",
      },
      sets: [...selected],
      questions: f.get("questions") || "",
    };
    // Open the players' window synchronously inside the click so popup blockers allow it.
    // A fixed window name: a new game reuses the players' window of the previous one (e.g. already
    // full-screen on the projector) instead of opening another.
    const popup = window.open("about:blank", "azkviz-board", "popup,width=1280,height=820");
    try {
      const res = await fetch("/api/games", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || I18N.t("create_failed"));
      if (popup) popup.location.href = `/g/${data.id}`;
      location.href = `/g/${data.id}/referee?t=${encodeURIComponent(data.token)}` + (popup ? "" : "&popup=blocked");
    } catch (e) {
      if (popup) popup.close();
      $("err").textContent = e.message;
    }
  });
</script>
</body>
</html>
