<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZ-kvíz – hráči</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 93,27 93,73 50,96 7,73 7,27' fill='%23ff8a1f'/></svg>">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  /* Passive projection: no controls, no cursor. */
  body { overflow: hidden; cursor: none; user-select: none; }
  .stage {
    height: 100vh; height: 100dvh; display: grid; gap: 1.5vmin; padding: 2vmin;
    grid-template-columns: minmax(150px, 1fr) minmax(0, 3.2fr) minmax(150px, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "status status status" "p0 board p1";
  }
  .status { grid-area: status; text-align: center; min-height: 2.6em; }
  .status .main { font-size: clamp(1rem, 3vmin, 2.2rem); font-weight: 800; }
  .status .sub { font-size: clamp(.8rem, 2.2vmin, 1.5rem); color: var(--muted); min-height: 1.3em; }
  .status .sub b { color: var(--accent); }
  .who0 { color: var(--p0); } .who1 { color: var(--p1); }
  .boardwrap { grid-area: board; min-height: 0; position: relative; }
  .boardwrap svg { position: absolute; inset: 0; }
  .player {
    align-self: center; border-radius: var(--radius); padding: 2.2vmin 1.6vmin; text-align: center;
    background: var(--panel); border: 3px solid transparent; transition: border-color .3s, box-shadow .3s, transform .3s;
  }
  .player.p0 { grid-area: p0; } .player.p1 { grid-area: p1; }
  .player .name { font-size: clamp(1rem, 3.4vmin, 2.6rem); font-weight: 800; word-break: break-word; }
  .player .count { font-size: clamp(2rem, 9vmin, 6rem); font-weight: 900; line-height: 1.1; }
  .player .lbl { color: var(--muted); font-size: clamp(.7rem, 1.6vmin, 1rem); text-transform: uppercase; letter-spacing: .1em; }
  .player.p0 .count { color: var(--p0); } .player.p1 .count { color: var(--p1); }
  .player .badge { margin-top: 1.2vmin; visibility: hidden; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    border-radius: 999px; padding: .3em .8em; display: inline-block; color: #111; font-size: clamp(.7rem, 1.8vmin, 1.1rem); }
  .player.p0 .badge { background: var(--p0); } .player.p1 .badge { background: var(--p1); color: #fff; }
  .player.on { transform: scale(1.04); }
  .player.p0.on { border-color: var(--p0); box-shadow: 0 0 4vmin rgba(255,138,31,.45); }
  .player.p1.on { border-color: var(--p1); box-shadow: 0 0 4vmin rgba(47,140,255,.45); }
  .player.on .badge { visibility: visible; }
  /* The opponent answering in place of the player on turn: a separate, outlined badge.
     "On turn" (badge + glow) never moves during a steal. */
  .player .badge2 { display: none; margin-top: 1vmin; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    border-radius: 999px; padding: .25em .8em; font-size: clamp(.7rem, 1.8vmin, 1.1rem); border: 2px solid; background: transparent;
    animation: blink 1s steps(2) infinite; }
  .player.p0 .badge2 { color: var(--p0); } .player.p1 .badge2 { color: var(--p1); }
  .player.answering .badge2 { display: inline-block; }
  .player.p0.answering { border-style: dashed; border-color: var(--p0); }
  .player.p1.answering { border-style: dashed; border-color: var(--p1); }

  /* ---------- question overlay: the picked hexagon flies out of the board ---------- */
  .qov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none; }
  .qov .backdrop { position: absolute; inset: 0; background: rgba(5, 12, 30, .78); opacity: 0; transition: opacity .5s; }
  .qov.show .backdrop { opacity: 1; }
  /* The question stays in the middle column, between the player panels, which sit above the
     dimmed backdrop so whose turn it is stays visible during a question. */
  .qbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3vmin; width: min(62vw, 1500px); }
  .player, .status { position: relative; z-index: 11; }
  .bighex { width: min(50vh, 46vw); aspect-ratio: 1 / 1; perspective: 1200px; }
  .bighex svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2vmin 5vmin rgba(0,0,0,.55)); }
  .bh-fill { fill: url(#g-empty); stroke: #0a1633; stroke-width: 3; }
  .bighex.p0 .bh-fill { fill: url(#g-p0); } .bighex.p1 .bh-fill { fill: url(#g-p1); } .bighex.black .bh-fill { fill: url(#g-black); }
  .bh-shine { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 2.5; }
  .bh-track { fill: none; stroke: rgba(10,22,51,.35); stroke-width: 9; stroke-linejoin: round; }
  .bh-time { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linejoin: round; stroke-linecap: round;
    stroke-dasharray: 100 100; transition: stroke .3s; }
  .bighex.ans0 .bh-time { stroke: var(--p0); } .bighex.ans1 .bh-time { stroke: var(--p1); }
  .bighex.low .bh-time { stroke: var(--bad); animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .bighex text { text-anchor: middle; dominant-baseline: central; font-weight: 900; fill: #1b2b55; }
  .bighex.p0 text, .bighex.p1 text, .bighex.black text { fill: #fff; }
  .bh-label { font-size: 17px; opacity: .65; letter-spacing: .08em; }
  .bh-sec { font-size: 20px; font-variant-numeric: tabular-nums; opacity: .8; }
  .qcard {
    text-align: center; opacity: 0; transform: translateY(2vmin); transition: opacity .45s, transform .45s;
    background: rgba(22, 41, 90, .92); border: 1px solid var(--line); border-radius: 20px; padding: 2vmin 4vmin;
    max-width: 100%; min-width: min(58vw, 900px);
  }
  .qov.show .qcard { opacity: 1; transform: none; transition-delay: .35s; }
  .qcard .who { font-size: clamp(.9rem, 2.6vmin, 1.8rem); font-weight: 800; }
  .qcard .qtext { font-size: clamp(1.5rem, 5.6vmin, 4.2rem); font-weight: 700; line-height: 1.2; margin-top: .3em; }
  .qcard .qtext:empty { display: none; }
  .qcard .ans { font-size: clamp(1.5rem, 5.8vmin, 4.4rem); margin-top: .35em; font-weight: 600; }
  .qcard .ans b { color: var(--accent); font-weight: 900; }
  .qcard .ans:empty { display: none; }

  /* ---------- winner banner (auto-hides, no interaction) ---------- */
  .winner { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; pointer-events: none;
    animation: winfade 7s ease forwards; }
  .winner > div {
    text-align: center; padding: 4vmin 7vmin; border-radius: 24px; background: rgba(10,22,51,.92);
    border: 4px solid var(--accent); box-shadow: 0 0 10vmin rgba(255,211,77,.35); animation: pop .5s ease-out;
  }
  .winner .t { font-size: clamp(1rem, 3vmin, 2rem); color: var(--muted); text-transform: uppercase; letter-spacing: .15em; }
  .winner .n { font-size: clamp(2rem, 10vmin, 7rem); font-weight: 900; }
  .winner .n.p0 { color: var(--p0); } .winner .n.p1 { color: var(--p1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes winfade { 0%, 85% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }

  @media (max-aspect-ratio: 1/1) {
    .player, .status { z-index: auto; }
    .qbox { width: min(92vw, 1500px); }
    body { overflow: auto; }
    .stage { height: auto; min-height: 100vh; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto;
      grid-template-areas: "status status" "p0 p1" "board board"; padding: 12px 16px; }
    .boardwrap svg { position: static; height: auto; }
    .bighex { width: min(70vw, 40vh); }
  }
  @media (prefers-reduced-motion: reduce) { .bighex.low .bh-time { animation: none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="status"><div class="main" id="status"></div><div class="sub" id="substatus"></div></div>
  <div class="player p0" id="pl0"><div class="lbl" data-i18n="player"></div><div class="name"></div><div class="count">0</div><div class="lbl" data-i18n="fields"></div><div class="badge" data-i18n="on_turn"></div><div class="badge2" data-i18n="answering_badge"></div></div>
  <div class="boardwrap"><svg id="board"></svg></div>
  <div class="player p1" id="pl1"><div class="lbl" data-i18n="player"></div><div class="name"></div><div class="count">0</div><div class="lbl" data-i18n="fields"></div><div class="badge" data-i18n="on_turn"></div><div class="badge2" data-i18n="answering_badge"></div></div>
</div>

<div class="qov" id="qov" hidden>
  <div class="backdrop"></div>
  <div class="qbox">
    <div class="bighex" id="bighex">
      <svg viewBox="-100 -100 200 200">
        <polygon class="bh-fill" id="bhFill"/>
        <polygon class="bh-shine" id="bhShine"/>
        <polygon class="bh-track" id="bhTrack"/>
        <polygon class="bh-time" id="bhTime" pathLength="100"/>
        <text class="bh-label" id="bhLabel" y="-56"></text>
        <text class="bh-hint" id="bhHint" y="2"></text>
        <text class="bh-sec" id="bhSec" y="58"></text>
      </svg>
    </div>
    <div class="qcard"><div class="who" id="qwho"></div><div class="qtext" id="qtext"></div><div class="ans" id="qans"></div></div>
  </div>
</div>

<div class="winner" id="winner" hidden><div><div class="t" id="wt"></div><div class="n" id="wn"></div></div></div>
<div class="conn" id="conn"></div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let state = null;
  const RESOLVE_EVENTS = new Set(["correct", "black", "wrong", "win"]);
  const HOLD_MS = 3400;      // how long the judged hexagon stays big before flying back

  I18N.apply();
  $("conn").textContent = I18N.t("conn_connecting");
  const board = AZ.createBoard($("board"));
  const conn = AZ.connect({
    onState: render,
    onError: () => {},       // this window never sends actions
    onStatus: (ok) => { $("conn").textContent = ok ? "" : I18N.t("conn_lost"); $("conn").classList.toggle("off", !ok); },
    // (the label stays empty while connected, so a language switch never needs to refresh it)
  });

  // Sound: only if the referee chose this window as the sound source. Browsers allow audio once the
  // window has been clicked (any click anywhere, nothing visible needed) or with autoplay allowed.
  const soundHere = () => state && state.settings.sound === "board";
  try { AZ.audio(); } catch (_) {}
  ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { try { AZ.audio(); } catch (_) {} }));
  AZ.runTicker(() => state && state.timer, soundHere);

  // ---------- big hexagon ----------
  const bighex = $("bighex");
  $("bhFill").setAttribute("points", AZ.hexPoints(0, 0, 96));
  $("bhShine").setAttribute("points", AZ.hexPoints(0, 0, 84));
  $("bhTrack").setAttribute("points", AZ.hexPoints(0, 0, 90));
  $("bhTime").setAttribute("points", AZ.hexPoints(0, 0, 90));
  const qov = $("qov");
  const ov = { cell: null, mode: null, timers: [] };
  const later = (fn, ms) => ov.timers.push(setTimeout(fn, ms));
  const stopAnims = () => { ov.timers.forEach(clearTimeout); ov.timers = []; bighex.getAnimations().forEach((a) => a.cancel()); };

  function setFill(cls) {
    bighex.classList.remove("p0", "p1", "black");
    if (cls) bighex.classList.add(cls);
  }
  function setHint(text) {
    const t = $("bhHint");
    t.textContent = text;
    const n = [...text].length;
    t.setAttribute("font-size", n <= 2 ? 78 : n <= 3 ? 64 : n <= 5 ? 48 : n <= 8 ? 34 : 26);
  }
  // Transform that puts the big hexagon exactly over board cell i.
  function cellTransform(i) {
    const cell = $("board").querySelector(`g.cell[data-i="${i}"] .hex`);
    if (!cell) return "scale(.1)";
    const c = cell.getBoundingClientRect(), h = bighex.getBoundingClientRect();
    const dx = c.left + c.width / 2 - (h.left + h.width / 2);
    const dy = c.top + c.height / 2 - (h.top + h.height / 2);
    // big hex polygon spans 192/200 of its box; board hex spans its full rect
    const s = c.height / (h.height * 0.96);
    return `translate(${dx}px, ${dy}px) scale(${s})`;
  }

  function openOverlay(s, animate) {
    stopAnims();
    ov.cell = s.active; ov.mode = "question";
    qov.hidden = false;
    fillQuestion(s);
    void qov.offsetWidth;            // ensure the backdrop transition runs
    qov.classList.add("show");
    if (animate) {
      bighex.animate(
        [{ transform: cellTransform(s.active) + " rotate(-360deg)" }, { transform: "none" }],
        { duration: 950, easing: "cubic-bezier(.2,.75,.25,1)" });
    }
  }

  function fillQuestion(s) {
    const q = s.question, who = ["offer", "steal"].includes(s.phase) ? 1 - s.turn : s.turn;
    setFill(q.kind === "yesno" ? "black" : null);
    bighex.classList.remove("ans0", "ans1");
    bighex.classList.add("ans" + who);
    $("bhLabel").textContent = (I18N.t("field") + " " + s.labels[s.active]).toUpperCase();
    setHint(q.kind === "yesno" ? "?" : (q.h || "?"));
    $("qwho").className = "who who" + who;
    const name = s.names[who];
    $("qwho").textContent = I18N.t(s.phase === "offer" ? "offer_for" : s.phase === "steal" ? "answers_steal" : q.kind === "yesno" ? "yesno_for" : "answers", { name });
    $("qtext").textContent = q.q || "";
    $("qans").textContent = "";
  }

  function resolveOverlay(s) {
    stopAnims();
    ov.mode = "resolve";
    const r = s.reveal;
    const cls = r.owner === 2 ? "black" : "p" + r.owner;
    bighex.classList.remove("ans0", "ans1", "low");
    $("bhSec").textContent = "";
    $("qwho").className = "who" + (r.owner === 2 ? "" : " who" + r.owner);
    $("qwho").textContent = AZ.outcomeText(r, s.names);
    if (r.a) {
      $("qans").innerHTML = "<span></span> <b></b>";
      $("qans").querySelector("span").textContent = I18N.t("correct_answer");
      $("qans").querySelector("b").textContent = AZ.answerText(r.kind, r.a);
    }
    // card-flip: turn edge-on, swap colour, turn back
    const half = { duration: 260, easing: "ease-in", fill: "forwards" };
    bighex.animate([{ transform: "none" }, { transform: "rotateY(90deg)" }], half).finished.then(() => {
      setFill(cls);
      bighex.getAnimations().forEach((a) => a.cancel());
      bighex.animate([{ transform: "rotateY(-90deg) scale(1.06)" }, { transform: "none" }], { duration: 420, easing: "cubic-bezier(.2,.9,.3,1.3)" });
    }).catch(() => {});
    later(() => flyBack(r.cell), HOLD_MS);
  }

  function flyBack(cell) {
    qov.classList.remove("show");
    const a = bighex.animate([{ transform: "none" }, { transform: cellTransform(cell) + " rotate(360deg)" }],
      { duration: 750, easing: "cubic-bezier(.5,0,.75,.3)", fill: "forwards" });
    a.finished.then(() => { closeOverlay(); showWinner(); }).catch(() => {});
  }

  function closeOverlay() {
    stopAnims();
    ov.cell = null; ov.mode = null;
    qov.classList.remove("show");
    qov.hidden = true;
  }

  function shake() {
    bighex.animate([0, -18, 16, -12, 8, -4, 0].map((x) => ({ transform: `translateX(${x}px)` })),
      { duration: 500, easing: "ease-out" });
  }

  // countdown on the hexagon outline
  (function tick() {
    const t = state && state.timer;
    const left = AZ.timeLeft(t);
    const time = $("bhTime");
    if (ov.mode === "question" && left !== null) {
      time.style.visibility = "visible";
      time.style.strokeDashoffset = String(100 - 100 * left / t.duration);
      $("bhSec").textContent = Math.ceil(left);
      bighex.classList.toggle("low", left <= 3);
    } else {
      time.style.visibility = "hidden";
      if (ov.mode === "question") $("bhSec").textContent = "";
      bighex.classList.remove("low");
    }
    requestAnimationFrame(tick);
  })();

  // ---------- winner ----------
  let winnerSeq = null;
  function showWinner() {
    const s = state;
    if (!s || s.phase !== "over" || ov.mode || winnerSeq === s.event.seq) return;
    if (s.winner === null && !s.tie) return;
    winnerSeq = s.event.seq;
    const w = $("winner");
    $("wt").textContent = I18N.t(s.tie ? "tie" : "winner");
    $("wn").className = "n" + (s.tie ? "" : " p" + s.winner);
    $("wn").textContent = s.tie ? `${s.counts[0]} : ${s.counts[1]}` : s.names[s.winner];
    w.hidden = true; void w.offsetWidth; w.hidden = false;   // restart the CSS animation
  }

  // ---------- render ----------
  function render(s) {
    const prevSeq = state ? state.event.seq : null;
    const fresh = prevSeq !== null && s.event.seq !== prevSeq;   // a new event, not a (re)connect
    state = s;
    if (I18N.set(s.settings.lang) && ov.mode === "question") fillQuestion(s);
    document.title = I18N.t("title_board", { a: s.names[0], b: s.names[1] });
    board.update(s);

    const answering = ["offer", "steal"].includes(s.phase) ? 1 - s.turn : s.turn;
    [0, 1].forEach((p) => {
      const pl = $("pl" + p);
      pl.querySelector(".name").textContent = s.names[p];
      pl.querySelector(".count").textContent = s.counts[p];
      pl.classList.toggle("on", s.phase !== "over" && p === s.turn);
      pl.classList.toggle("answering", ["offer", "steal"].includes(s.phase) && p === answering);
    });
    renderStatus(s, answering);

    if (s.question) {
      if (ov.cell !== s.active || ov.mode !== "question") openOverlay(s, fresh && s.event.type === "pick");
      else fillQuestion(s);
      if (fresh && s.event.type === "wrong" && s.phase === "offer") shake();
    } else if (ov.mode === "question") {
      if (fresh && RESOLVE_EVENTS.has(s.event.type) && s.reveal && s.reveal.cell === ov.cell) resolveOverlay(s);
      else closeOverlay();
    } else if (ov.mode === "resolve" && !(s.reveal && s.reveal.cell === ov.cell)) {
      closeOverlay();
    }
    if (s.phase !== "over") { winnerSeq = null; $("winner").hidden = true; }
    showWinner();

    if (fresh && soundHere()) AZ.play(s.event.type);
  }

  function renderStatus(s, who) {
    const st = $("status"), sub = $("substatus");
    sub.textContent = "";
    if (s.phase === "over") {
      if (s.tie) { st.textContent = I18N.t("tie_status"); return; }
      st.textContent = "";
      st.append(...withName(I18N.t("wins", { name: "\u0000" }), s.names[s.winner], s.winner));
      return;
    }
    st.textContent = "";
    st.append(...withName("\u0000 " + AZ.phaseText(s.phase), s.names[who], who));
    if (s.phase === "pick" && s.reveal) {
      sub.textContent = `${I18N.t("field_result", { label: s.reveal.label })} ${AZ.outcomeText(s.reveal, s.names)} `;
      if (s.reveal.a) {
        const b = document.createElement("b");
        b.textContent = AZ.answerText(s.reveal.kind, s.reveal.a);
        sub.append(I18N.t("answer_label") + " ", b);
      }
    }
  }

  // Split a translated string at the \u0000 placeholder and put the coloured player name there.
  function withName(text, name, player) {
    const [before, after = ""] = text.split("\u0000");
    const span = document.createElement("span");
    span.className = "who" + player;
    span.textContent = name;
    return [before, span, after];
  }
</script>
</body>
</html>
